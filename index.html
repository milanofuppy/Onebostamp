<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おねぼうスタンプカード</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おねぼう">
<meta name="theme-color" content="#0e1526">
<style>
:root{--bg:#eef3fb;--fg:#14233f;--tab:#dbe6f8;--tabon:#1d3f8f;--tabonfg:#fff;--btn:#e8505b;--sub:#5a6b8c;--line:#b9c8e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1526;--fg:#e8eefc;--tab:#1c2a4a;--tabon:#5b86e5;--tabonfg:#0b1426;--sub:#93a4c9;--line:#2c3d66}}
:root[data-theme="dark"]{--bg:#0e1526;--fg:#e8eefc;--tab:#1c2a4a;--tabon:#5b86e5;--tabonfg:#0b1426;--sub:#93a4c9;--line:#2c3d66}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 28px;display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:0 0 auto;border:0;border-radius:999px;padding:9px 16px;background:var(--tab);color:var(--fg);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--tabon);color:var(--tabonfg)}
.tab.add{font-size:18px;padding:7px 15px}
.name{display:flex;align-items:center;gap:8px;margin:10px 2px;color:var(--sub);font-size:13px}
.name input{flex:0 1 9em;width:9em;min-width:0;font-size:16px;font-weight:700;color:var(--fg);background:transparent;border:0;border-bottom:1px dashed var(--line);padding:4px 2px}
.img-btn{margin-left:auto;border:1px solid var(--line);background:var(--tab);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.card{position:relative;width:100%;container-type:inline-size;border-radius:3.2cqw;overflow:hidden;line-height:0}
.card img.bg{width:100%;display:block}
.num{position:absolute;left:57.6%;top:8.4%;transform:translate(-50%,-50%);color:#fff;font-weight:800;font-size:5cqw;line-height:1;text-shadow:0 .3cqw 0 rgba(0,0,0,.25)}
.slot{position:absolute;width:16%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%}
.slot.done::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(235,242,255,.62)}
.slot img{position:absolute;left:50%;top:50%;width:84%;transform:translate(-50%,-50%) rotate(-8deg);filter:drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.25))}
.dt{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);background:rgba(20,35,63,.8);color:#fff;font-size:2.8cqw;font-weight:800;line-height:1;padding:.5cqw 1.3cqw;border-radius:2cqw;white-space:nowrap}
.patch{position:absolute;z-index:3;border-radius:5cqw;background-size:100cqw auto;background-repeat:no-repeat}
.slot.pop img{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) rotate(-30deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}}
.info{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin:10px 2px}
.btns{display:flex;gap:10px;margin-top:6px}
button.main{flex:1;border:0;border-radius:14px;padding:15px;background:var(--btn);color:#fff;font-size:17px;font-weight:800;cursor:pointer}
button.undo{border:1px solid var(--line);border-radius:14px;padding:15px 18px;background:transparent;color:var(--fg);font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:active:not(:disabled){transform:scale(.97)}
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 16px)}
#ov[hidden]{display:none}
.ovtop{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:700;margin:0 auto 10px;max-width:720px}
.ovtop button{border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;background:#fff;color:#14233f;cursor:pointer}
#out{display:block;width:100%;max-width:720px;margin:0 auto;border-radius:12px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.bt{align-self:flex-start;margin:auto 0 0 12%;padding-top:90px;display:flex;gap:14px}
.rsb{display:block;background:none;border:0;color:var(--sub);font-size:12px;text-decoration:underline;opacity:.75;cursor:pointer;padding:8px 12px}
.rsb:disabled{opacity:.3;cursor:default}
#rs,#rs2{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
#rs[hidden],#rs2[hidden]{display:none}
.rsbox{width:100%;max-width:340px;background:var(--bg);color:var(--fg);border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.rsbox h3{margin:0 0 6px;font-size:18px}.rsbox p{margin:0 0 16px;font-size:13px;color:var(--sub);line-height:1.5}
.rsbox button{display:block;width:100%;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;border:1px solid var(--line);background:var(--tab);color:var(--fg)}
.rsbox button.danger{background:var(--btn);border-color:var(--btn);color:#fff}
#ld{color:#fff;text-align:center;padding:40px 0}
</style></head><body><div class="wrap">

const KEY="oneboo-v1";
const FONT='"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
const POS=[[242,375],[595,375],[950,375],[1305,375],[242,740],[595,740],[950,740]];
const DEF=["わらびー","烏龍茶","ぶろこりー","ミラノ","ぼでぃそ"];
let S={people:DEF.map(n=>({name:n,stamps:[]})),active:0};
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.people)&&d.people.length)S=d}}catch(e){}
S.people.forEach(p=>{if(!Array.isArray(p.stamps))p.stamps=Array(p.count||0).fill(null);delete p.count});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){const d=new Date();return (d.getMonth()+1)+"/"+d.getDate()}
let hold=null,popIdx=-1,timer=null;
const $=id=>document.getElementById(id);
const BG=document.querySelector("img.bg").src;
function render(){
  if(S.active>=S.people.length)S.active=0;
  const p=S.people[S.active],n=p.stamps.length;
  const t=$("tabs");t.innerHTML="";
  S.people.forEach((q,i)=>{const b=document.createElement("button");b.className="tab"+(i===S.active?" on":"");b.textContent=q.name||"名無し";b.onclick=()=>{S.active=i;hold=null;popIdx=-1;save();render()};t.appendChild(b)});
  const a=document.createElement("button");a.className="tab add";a.textContent="＋";a.setAttribute("aria-label","メンバー追加");
  a.onclick=()=>{S.people.push({name:"メンバー"+(S.people.length+1),stamps:[]});S.active=S.people.length-1;hold=null;save();render();t.scrollLeft=t.scrollWidth;$("nm").focus();$("nm").select()};
  t.appendChild(a);
  if(document.activeElement!==$("nm"))$("nm").value=p.name;
  let cardNo=Math.floor(n/7)+1,filled=n%7;
  if(hold!==null){cardNo=hold.card;filled=7}
  const base=(cardNo-1)*7;
  $("num").textContent=cardNo;
  document.querySelectorAll(".slot,.patch").forEach(e=>e.remove());
  POS.forEach((c,i)=>{const d=document.createElement("div");const on=i<filled;
    d.className="slot"+(on?" done":"")+(i===popIdx&&on?" pop":"");
    d.style.left=(c[0]/1570*100)+"%";d.style.top=(c[1]/1002*100)+"%";
    if(on){const im=document.createElement("img");im.src=STAMP;im.alt="お寝坊";d.appendChild(im);
      const dt=p.stamps[base+i];if(dt){const l=document.createElement("div");l.className="dt";l.textContent=dt;d.appendChild(l)}}
    $("card").appendChild(d);
    if(on){const q=document.createElement("div");q.className="patch";
      const x=c[0]-16,y=c[1]+70,w=162,h=75;
      q.style.left=(x/1570*100)+"%";q.style.top=(y/1002*100)+"%";q.style.width=(w/1570*100)+"%";q.style.height=(h/1002*100)+"%";
      q.style.backgroundImage="url("+BG+")";q.style.backgroundPosition=(-x/1570*100)+"cqw "+(-y/1570*100)+"cqw";
      $("card").appendChild(q)}});
  $("cnt").textContent=cardNo+"枚目 ・ "+filled+" / 7日";
  $("tot").textContent="累計おねぼう "+n+"回";
  $("undo").disabled=n===0;$("dlb").disabled=S.people.length<=1;
}
$("push").onclick=()=>{
  const p=S.people[S.active];
  if(timer){clearTimeout(timer);timer=null;hold=null}
  p.stamps.push(today());const n=p.stamps.length;popIdx=(n-1)%7;
  if(n%7===0){hold={card:n/7};timer=setTimeout(()=>{hold=null;timer=null;popIdx=-1;render()},1800)}
  save();render();
};
$("undo").onclick=()=>{
  const p=S.people[S.active];if(!p.stamps.length)return;
  if(timer){clearTimeout(timer);timer=null}
  hold=null;popIdx=-1;p.stamps.pop();save();render();
};
$("nm").oninput=e=>{S.people[S.active].name=e.target.value;save();
  const tabs=document.querySelectorAll(".tab:not(.add)");if(tabs[S.active])tabs[S.active].textContent=e.target.value||"名無し"};

/* まとめ画像 */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCard(c,bg,st,p,x,y,w){
  const s=w/1570,h=1002*s,n=p.stamps.length,cardNo=Math.floor(n/7)+1,filled=n%7,base=(cardNo-1)*7;
  c.save();rr(c,x,y,w,h,50*s);c.clip();
  c.drawImage(bg,x,y,w,h);
  c.fillStyle="#fff";c.font="800 "+(78*s)+"px "+FONT;c.textAlign="center";c.textBaseline="middle";c.fillText(String(cardNo),x+905*s,y+85*s);
  POS.forEach((q,i)=>{if(i>=filled)return;
    const cx=x+q[0]*s,cy=y+q[1]*s;
    c.fillStyle="rgba(235,242,255,.62)";c.beginPath();c.arc(cx,cy,125*s,0,Math.PI*2);c.fill();
    const sw=211*s,sh=sw*st.height/st.width;
    c.save();c.translate(cx,cy);c.rotate(-8*Math.PI/180);c.drawImage(st,-sw/2,-sh/2,sw,sh);c.restore();
    const px=q[0]-16,py=q[1]+70,pw=162,ph=75;
    c.save();rr(c,x+px*s,y+py*s,pw*s,ph*s,37*s);c.clip();c.drawImage(bg,px,py,pw,ph,x+px*s,y+py*s,pw*s,ph*s);c.restore();
    const dt=p.stamps[base+i];
    if(dt){const fs=44*s;c.font="800 "+fs+"px "+FONT;const tw=c.measureText(dt).width,pw2=tw+40*s,ph2=fs+16*s;
      c.fillStyle="rgba(20,35,63,.8)";rr(c,cx-pw2/2,cy+40*s-ph2/2,pw2,ph2,ph2/2);c.fill();
      c.fillStyle="#fff";c.textAlign="center";c.textBaseline="middle";c.fillText(dt,cx,cy+40*s+1*s)}
  });
  c.restore();
}
async function makeSummary(){
  const [bg,st]=await Promise.all([loadImg(BG),loadImg(STAMP)]);
  const P=S.people,N=P.length,W=1540,pad=40,gap=30,cw=(W-pad*2-gap)/2,ch=cw*1002/1570,nameH=64,rowH=nameH+ch+36;
  const rows=Math.ceil(N/2),top=170,rk=P.map((p,i)=>({p,n:p.stamps.length,i})).sort((a,b)=>b.n-a.n||a.i-b.i).slice(0,5);
  const rkTop=top+rows*rowH+20,H=Math.ceil(rkTop+110+rk.length*84+50);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b1633");g.addColorStop(1,"#1d3f8f");c.fillStyle=g;c.fillRect(0,0,W,H);
  c.textBaseline="middle";c.textAlign="center";c.fillStyle="#fff";c.font="800 62px "+FONT;c.fillText("おねぼうスタンプカード",W/2,64);
  const d=new Date();c.fillStyle="#9fb4e8";c.font="600 30px "+FONT;c.fillText(d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" 時点の進捗",W/2,122);
  P.forEach((p,i)=>{
    const r=Math.floor(i/2),col=i%2,alone=(i===N-1&&N%2===1);
    const x=alone?(W-cw)/2:pad+col*(cw+gap),y=top+r*rowH;
    c.textAlign="left";c.fillStyle="#fff";c.font="800 40px "+FONT;c.fillText(p.name||"名無し",x+6,y+nameH/2);
    const n=p.stamps.length;c.textAlign="right";c.fillStyle="#9fb4e8";c.font="600 28px "+FONT;
    c.fillText((Math.floor(n/7)+1)+"枚目 "+(n%7)+"/7",x+cw-6,y+nameH/2);
    drawCard(c,bg,st,p,x,y+nameH,cw);
  });
  c.fillStyle="rgba(255,255,255,.1)";rr(c,pad,rkTop,W-pad*2,110+rk.length*84-10,30);c.fill();
  c.textAlign="center";c.fillStyle="#fff";c.font="800 44px "+FONT;c.fillText("おねぼうランキング",W/2,rkTop+56);
  const medal=["#f2c230","#c9d1de","#d08a4e"];
  rk.forEach((o,j)=>{
    const rank=rk.findIndex(z=>z.n===o.n)+1,y=rkTop+110+j*84+30;
    const bx=pad+90;
    if(rank===1){
      c.beginPath();c.moveTo(bx-44,y+30);c.lineTo(bx-50,y-28);c.lineTo(bx-22,y-5);c.lineTo(bx,y-36);c.lineTo(bx+22,y-5);c.lineTo(bx+50,y-28);c.lineTo(bx+44,y+30);c.closePath();
      c.fillStyle="#f2c230";c.fill();c.lineWidth=4;c.lineJoin="round";c.strokeStyle="#b8860b";c.stroke();
      [[bx-50,y-28],[bx,y-36],[bx+50,y-28]].forEach(q=>{c.beginPath();c.arc(q[0],q[1],6,0,Math.PI*2);c.fillStyle="#fff3b0";c.fill();c.stroke()});
      c.fillStyle="#0b1633";c.textAlign="center";c.font="800 34px "+FONT;c.fillText("1",bx,y+6);
    }else{
      c.fillStyle=medal[rank-1]||"#5b86e5";c.beginPath();c.arc(bx,y,32,0,Math.PI*2);c.fill();
      c.fillStyle="#0b1633";c.textAlign="center";c.font="800 32px "+FONT;c.fillText(String(rank),bx,y+1);
    }
    c.fillStyle="#fff";c.textAlign="left";c.font="800 38px "+FONT;const nm=o.p.name||"名無し";c.fillText(nm,pad+150,y);
    if(rank===1){const nw=c.measureText(nm).width;c.fillStyle="#f2c230";c.font="800 32px "+FONT;c.fillText("おねぼうキング🤴",pad+150+nw+18,y+1)}
    c.textAlign="right";c.font="800 40px "+FONT;c.fillText(o.n+"回",W-pad-60,y);
  });
  return cv.toDataURL("image/png");
}
$("sum").onclick=async()=>{
  $("ov").hidden=false;$("ld").hidden=false;$("out").hidden=true;
  try{$("out").src=await makeSummary();$("out").hidden=false;$("ld").hidden=true}
  catch(e){$("ld").textContent="画像を作れませんでした"}
};
$("cl").onclick=()=>{$("ov").hidden=true;$("out").removeAttribute("src")};
function closeDl(){$("rs2").hidden=true}
$("dlb").onclick=()=>{if(S.people.length<=1)return;$("dlt").textContent="「"+(S.people[S.active].name||"名無し")+"」を削除しますか？";$("rs2").hidden=false};
$("dln").onclick=closeDl;
$("rs2").onclick=e=>{if(e.target.id==="rs2")closeDl()};
$("dly").onclick=()=>{
  if(S.people.length<=1){closeDl();return}
  if(timer){clearTimeout(timer);timer=null}
  hold=null;popIdx=-1;S.people.splice(S.active,1);S.active=Math.max(0,S.active-1);
  save();closeDl();render();
};
function closeRs(){$("rs").hidden=true}
function doReset(all){
  if(timer){clearTimeout(timer);timer=null}
  hold=null;popIdx=-1;
  (all?S.people:[S.people[S.active]]).forEach(p=>{p.stamps=[]});
  save();closeRs();render();
}
$("rsb").onclick=()=>{$("rs1").textContent="「"+(S.people[S.active].name||"名無し")+"」だけリセット";$("rs").hidden=false};
$("rs1").onclick=()=>doReset(false);
$("rsa").onclick=()=>doReset(true);
$("rsc").onclick=closeRs;
$("rs").onclick=e=>{if(e.target.id==="rs")closeRs()};
render();
</script></body></html>
